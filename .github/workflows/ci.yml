name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wit
          POSTGRES_PASSWORD: wit
          POSTGRES_DB: wit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The MUST-assertion suite (docs/*: `# spec:` links) against a real DB.
      - run: bun test
        env:
          DATABASE_URL: postgres://wit:wit@localhost:5432/wit
      - run: bun run --cwd app build

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check

  # Deploy = publish the image; tars (ops_atlas manifest app) auto-pulls
  # ghcr :latest every 5 minutes (linker convention).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/theoryzhenkov/wit/wit:latest
            ghcr.io/theoryzhenkov/wit/wit:${{ github.sha }}
