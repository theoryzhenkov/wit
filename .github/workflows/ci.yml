name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wit
          POSTGRES_PASSWORD: wit
          POSTGRES_DB: wit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Workspace packages export from dist/ — build them before typecheck.
      - run: bun run --cwd packages/client build && bun run --cwd packages/astro build
      - run: bun run typecheck
      # The MUST-assertion suite (docs/*: `# spec:` links) against a real DB.
      - run: bun test
        env:
          DATABASE_URL: postgres://wit:wit@localhost:5432/wit
      - run: bun run --cwd app build

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check

  # Deploy = publish the image via the shared workflow (linker convention); its
  # webhook step makes tars redeploy within seconds, with 30min polling as
  # fallback.
  image:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: app
    permissions:
      contents: read
      packages: write
    uses: theoryzhenkov/.github/.github/workflows/deploy-docker.yml@main
    with:
      app_name: wit
    secrets: inherit
